
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Patient Queue System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef3f7;
            margin: 0;
            padding: 20px;
            color: #243447;
        }

        .container {
            max-width: 850px;
            margin: 20px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #00000015;
        }

        h1, h2 {
            color: #087f8c;
        }

        h1 {
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #617080;
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            margin: 7px 0;
            box-sizing: border-box;
            font-size: 15px;
            border-radius: 5px;
        }

        input, select {
            border: 1px solid #cbd5df;
        }

        button {
            background: #087f8c;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #06636d;
        }

        .serve-button {
            background: #176b45;
        }

        .clear-button {
            background: #b83b3b;
        }

        .panel {
            background: #f6f9fb;
            border: 1px solid #e0e8ee;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
        }

        .stats {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .stat {
            background: #e5f5f6;
            padding: 15px;
            flex: 1;
            text-align: center;
            border-radius: 8px;
        }

        .stat strong {
            display: block;
            font-size: 25px;
            margin-top: 8px;
        }

        .patient {
            background: white;
            border: 1px solid #dce5eb;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
        }

        .emergency {
            border-left: 5px solid #d93025;
        }

        .normal {
            border-left: 5px solid #087f8c;
        }

        .tag {
            font-size: 12px;
            font-weight: bold;
        }

        .red {
            color: #c5221f;
        }

        .green {
            color: #176b45;
        }

        #message {
            font-weight: bold;
            text-align: center;
        }

        @media (max-width: 500px) {
            .stats {
                flex-direction: column;
            }

            .container {
                padding: 15px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Hospital Patient Queue System</h1>
        <p class="subtitle">
            Patient registration and waiting list management
        </p>

        <div class="panel">
            <h2>Register Patient</h2>

            <form id="patientForm">
                <label for="patientName">Patient Name</label>
                <input
                    type="text"
                    id="patientName"
                    placeholder="Enter patient name"
                    required
                >

                <label for="symptoms">Symptoms</label>
                <input
                    type="text"
                    id="symptoms"
                    placeholder="Enter reported symptoms"
                    required
                >

                <label for="priority">Patient Category</label>
                <select id="priority">
                    <option value="normal">Routine</option>
                    <option value="emergency">Emergency - Staff Assessment Required</option>
                </select>

                <button type="submit">Register Patient</button>
            </form>
        </div>

        <div class="stats">
            <div class="stat">
                Patients Waiting
                <strong id="waitingCount">0</strong>
            </div>

            <div class="stat">
                Patients Served
                <strong id="servedCount">0</strong>
            </div>
        </div>

        <div class="panel">
            <h2>Current Patient</h2>
            <p id="currentPatient">No patient called yet.</p>

            <button class="serve-button" onclick="callNextPatient()">
                Call Next Patient
            </button>
        </div>

        <div class="panel">
            <h2>Waiting List</h2>
            <p id="queueMessage">No patients waiting.</p>
            <div id="patientList"></div>
        </div>

        <p id="message" role="status"></p>

        <button class="clear-button" onclick="resetSystem()">
            Reset Demonstration
        </button>
    </div>

    <script>
        // Two queues demonstrate FIFO and priority handling.
        let emergencyQueue = [];
        let normalQueue = [];

        let nextTicket = 1;
        let servedCount = 0;

        // Register a patient and add them to the correct queue.
        document.getElementById("patientForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                let name = document.getElementById("patientName")
                    .value.trim();

                let symptoms = document.getElementById("symptoms")
                    .value.trim();

                let priority = document.getElementById("priority")
                    .value;

                if (name === "" || symptoms === "") {
                    showMessage("Please complete all fields.");
                    return;
                }

                let patient = {
                    ticket: nextTicket,
                    name: name,
                    symptoms: symptoms,
                    priority: priority
                };

                // Enqueue operation
                if (priority === "emergency") {
                    emergencyQueue.push(patient);
                } else {
                    normalQueue.push(patient);
                }

                nextTicket++;

                document.getElementById("patientForm").reset();

                showMessage(
                    "Patient registered. Ticket number: " +
                    patient.ticket
                );

                displayQueue();
            });

        // Select the next patient for staff attention.
        function callNextPatient() {
            let patient;

            // Emergency cases are displayed first in this demo.
            // Real emergencies require immediate clinical assessment.
            if (emergencyQueue.length > 0) {
                patient = emergencyQueue.shift();
            } else if (normalQueue.length > 0) {
                patient = normalQueue.shift();
            } else {
                showMessage("There are no patients waiting.");
                return;
            }

            // Dequeue operation
            servedCount++;

            document.getElementById("currentPatient").textContent =
                "Ticket #" + patient.ticket + " - " +
                patient.name + " | Symptoms: " +
                patient.symptoms;

            showMessage(
                "Ticket #" + patient.ticket +
                " has been called for staff attention."
            );

            displayQueue();
        }

        // Display emergency patients first, then routine patients.
        function displayQueue() {
            let list = document.getElementById("patientList");

            list.innerHTML = "";

            let allPatients = emergencyQueue.concat(normalQueue);

            document.getElementById("waitingCount").textContent =
                allPatients.length;

            document.getElementById("servedCount").textContent =
                servedCount;

            document.getElementById("queueMessage").textContent =
                allPatients.length === 0
                    ? "No patients waiting."
                    : "Patients are listed by category and arrival order.";

            for (let i = 0; i < allPatients.length; i++) {
                let patient = allPatients[i];

                let card = document.createElement("div");

                card.className = "patient " + patient.priority;

                let heading = document.createElement("strong");

                heading.textContent =
                    "Ticket #" + patient.ticket + " - " + patient.name;

                let category = document.createElement("p");

                category.className = "tag " +
                    (patient.priority === "emergency" ? "red" : "green");

                category.textContent =
                    patient.priority === "emergency"
                        ? "EMERGENCY - REQUIRES STAFF ASSESSMENT"
                        : "ROUTINE";

                let detail = document.createElement("p");

                detail.textContent = "Reported symptoms: " +
                    patient.symptoms;

                card.appendChild(heading);
                card.appendChild(category);
                card.appendChild(detail);

                list.appendChild(card);
            }
        }

        function showMessage(message) {
            document.getElementById("message").textContent = message;
        }

        // Reset the demonstration and its in-memory records.
        function resetSystem() {
            let confirmed = confirm(
                "Reset all demonstration data?"
            );

            if (!confirmed) {
                return;
            }

            emergencyQueue = [];
            normalQueue = [];
            nextTicket = 1;
            servedCount = 0;

            document.getElementById("currentPatient").textContent =
                "No patient called yet.";

            document.getElementById("patientForm").reset();

            showMessage("Demonstration reset successfully.");

            displayQueue();
        }

        // Show the initial empty queue.
        displayQueue();
    </script>
</body>
</html>
